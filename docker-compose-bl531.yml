services:
  redis:
    image: redis:7.4-rc2-alpine
    networks: 
      - qnet
    ports:
     - "127.0.0.1:6379:6379"
  ophyd-api:
    build: ./ophyd-api
    environment:
      - EPICS_CA_ADDR_LIST=${EPICS_CA_ADDR_LIST}
      - EPICS_CA_AUTO_ADDR_LIST=NO
      - ZMQ_HOST=localhost
      - ZMQ_PORT=60625
      - OAS_STARTUP_DIR=/startup/01_motors.py
    volumes:
      - ./queue-server/startup_bl531:/startup:ro
    network_mode: "host"
  frontend-api:
    build: ./frontend-api
    environment:
      - EPICS_CA_ADDR_LIST=${EPICS_CA_ADDR_LIST}
      - EPICS_CA_AUTO_ADDR_LIST=NO
      - ZMQ_HOST=localhost
      - ZMQ_PORT=60625
    network_mode: "host"
  qserver:
    build: ./queue-server
    environment:
      - EPICS_CA_ADDR_LIST=${EPICS_CA_ADDR_LIST}
      - EPICS_CA_AUTO_ADDR_LIST=NO
    network_mode: "host"
    command: ["start-re-manager", "--zmq-publish-console", "ON", "--redis-addr", "127.0.0.1:6379", "--startup-dir", "/code/startup_531", "--keep-re"]
    depends_on:
      - redis
  qserver-api:
   build: ./queue-server-api
   environment:
     - QSERVER_HTTP_SERVER_SINGLE_USER_API_KEY=test
     - QSERVER_HTTP_SERVER_CONFIG=/deploy/config.yml
     - QSERVER_ZMQ_HOST=qserver
   volumes:
     - ./queue-server-api/config.yml:/deploy/config.yml:ro
   network_mode: "host"
   command: ["uvicorn", "--host", "0.0.0.0", "--port", "60610", "bluesky_httpserver.server:app"]
   depends_on:
     - qserver
  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    networks:
      qnet:
        ipv4_address: 192.168.1.100
  
networks:
  qnet:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/24
