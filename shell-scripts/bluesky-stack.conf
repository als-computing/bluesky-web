#!/usr/bin/env bash
# Shared configuration for the Bluesky stack scripts.
#
#   start-Bluesky-example.sh  -> starts tmux session + ttyd web terminal
#   tmux-startup-example.sh   -> builds the tmux window and launches each process
#   stop-Bluesky-example.sh   -> tears everything down
#
# Every value below can be overridden from the environment, e.g.
#   SESSION=bl402 TTYD_PORT=7682 ./start-Bluesky-example.sh
# or by editing this file on the beamline computer.

# Where these scripts live. Normally set by the caller before sourcing; falls
# back to this file's own location so the conf is safe to source standalone.
STACK_SCRIPT_DIR="${STACK_SCRIPT_DIR:-$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)}"

# --- tmux -------------------------------------------------------------------
SESSION="${SESSION:-finch}"          # tmux session name
WIN="${WIN:-stack}"                  # window holding the process panes
TMUX_LABEL="${TMUX_LABEL:-}"         # optional tmux socket label (-L); empty = default socket

# --- ttyd -------------------------------------------------------------------
TTYD_BIND="${TTYD_BIND:-0.0.0.0}"
TTYD_PORT="${TTYD_PORT:-7681}"

# --- run state --------------------------------------------------------------
# start-Bluesky-example.sh records its pids here so stop-Bluesky-example.sh can
# shut down the exact ttyd process and close the terminal that launched it.
RUN_DIR="${RUN_DIR:-${XDG_RUNTIME_DIR:-/tmp}/bluesky-stack}"
STATE_FILE="${STATE_FILE:-$RUN_DIR/$SESSION.state}"

# 1 = stop also closes the terminal window running the start script.
# Set CLOSE_START_TERMINAL=0 to leave it open (e.g. to read the last log lines).
CLOSE_START_TERMINAL="${CLOSE_START_TERMINAL:-1}"

# --- conda ------------------------------------------------------------------
# Point this at your conda.sh. First existing candidate wins.
if [ -z "${CONDA_SH:-}" ]; then
  for _candidate in \
    "$HOME/miniconda3/etc/profile.d/conda.sh" \
    "$HOME/anaconda3/etc/profile.d/conda.sh" \
    "$HOME/miniforge3/etc/profile.d/conda.sh" \
    "/opt/conda/etc/profile.d/conda.sh"
  do
    [ -f "$_candidate" ] && CONDA_SH="$_candidate" && break
  done
  unset _candidate
fi
CONDA_SH="${CONDA_SH:-}"

# Conda environment names used by the panes
ENV_OPHYD_API="${ENV_OPHYD_API:-test_ophyd_websocket}"
ENV_FRONTEND_API="${ENV_FRONTEND_API:-frontend-api}"
ENV_BLUESKY="${ENV_BLUESKY:-bluesky}"
ENV_TILED="${ENV_TILED:-tiled-recovery}"

# --- repository locations ---------------------------------------------------
# These scripts live in <repo>/shell-scripts/, so the repo root is one level up.
# Defaulting off the script location means a checkout anywhere works without
# editing paths.
BLUESKY_WEB="${BLUESKY_WEB:-$(cd -- "$STACK_SCRIPT_DIR/.." && pwd)}"
FRONTEND_DIR="${FRONTEND_DIR:-$BLUESKY_WEB/frontend}"
OPHYD_WEBSOCKET_DIR="${OPHYD_WEBSOCKET_DIR:-$HOME/MoreRepos/ophyd-websocket}"

# --- beamline-specific bits -------------------------------------------------
BEAMLINE="${BEAMLINE:-bl531}"
STARTUP_DIR="${STARTUP_DIR:-$BLUESKY_WEB/queue-server/startup_$BEAMLINE}"
DEVICES_FILE="${DEVICES_FILE:-$STARTUP_DIR/01_devices.py}"
TILED_CONFIG="${TILED_CONFIG:-$BLUESKY_WEB/tiled/config_$BEAMLINE.yml}"

# --- queue server REST API --------------------------------------------------
QSERVER_HOST="${QSERVER_HOST:-0.0.0.0}"
QSERVER_PORT="${QSERVER_PORT:-60610}"
QSERVER_API_KEY="${QSERVER_API_KEY:-test}"
QSERVER_ALLOW_ORIGINS="${QSERVER_ALLOW_ORIGINS:-http://localhost:5173 http://192.168.10.201 http://192.168.10.155:5173 http://192.168.10.123 http://192.168.10.150}"

# --- helpers ----------------------------------------------------------------
# Run tmux against the configured socket.
tm() {
  if [ -n "$TMUX_LABEL" ]; then
    tmux -L "$TMUX_LABEL" "$@"
  else
    tmux "$@"
  fi
}
