authentication:
  single_user_api_key: ${TILED_SINGLE_USER_API_KEY}
  allow_anonymous_access: true
uvicorn:
  host: 0.0.0.0
  port: 8001
allow_origins:
  - http://localhost
# NOTE: the paths below are relative to the working directory tiled is launched
# from, NOT to this file. Run it from this folder:
#   cd tiled && tiled serve config config.yml
# (Or set TILED_DIR and use "${TILED_DIR}/..." to make them launch-independent.)
trees:
  - path: /
    tree: catalog
    args:
      uri: "sqlite:///catalog.db"
      writable_storage:
        - "./data"
        - "sqlite:///tabular.db"
      readable_storage:
        - "./data"
      init_if_not_exists: true
