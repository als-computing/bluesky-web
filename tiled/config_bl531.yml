authentication:
  single_user_api_key: ${TILED_SINGLE_USER_API_KEY}
  allow_anonymous_access: true
uvicorn:
  host: 0.0.0.0
  port: 8000
allow_origins:
  - http://192.168.10.155:5173
  - http://192.168.10.150:5173 
  - http://localhost:5173
  - http://localhost:5174
  - http://192.168.10.201:5173 
