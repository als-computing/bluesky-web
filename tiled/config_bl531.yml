  - http://131.243.153.165:5173
  - http://131.243.153.165:5174
  - http://tiled-test:5173
  - http://tiled-test:5174

trees:
  - path: /
    tree: catalog
    args:
      uri: "sqlite:////home/bl531user/tiled_test/catalog.db"
      writable_storage:
        - 'sqlite:////home/bl531user/tiled_test/tabular.db'
        - '/home/bl531user/tiled_test/storage'
        - 'sqlite:////mnt/data531/tiled/tabular.db'
      readable_storage:
        - "/mnt/data531/tiled/tabular.db"
        - "/mnt/data531/scans"
        - "/mnt/data531/20251113_test"
        - "/home/bl531user/tiled"
      init_if_not_exists: true
